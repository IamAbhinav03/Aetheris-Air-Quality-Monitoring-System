# ============================================================
# Aetheris fleet firmware
#
# ONE firmware image for the whole fleet. `name_add_mac_suffix`
# gives every board a unique name (aetheris-1a2b3c) at runtime,
# and the MQTT topic is built from that name. Flash the same
# binary to every air node.
#
# Wi-Fi / MQTT / OTA credentials live in secrets.yaml.
# Build and deploy with:
#   ./scripts/fleet.sh build
#   ./scripts/fleet.sh deploy --devices devices.csv
# ============================================================

substitutions:
  devicename: aetheris
  friendly_name: Aetheris Air Quality Monitor

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  # Appends the last 3 bytes of the MAC address, e.g. aetheris-1a2b3c.
  name_add_mac_suffix: true
  project:
    name: aetheris.airnode
    version: "1.0"

# ============================================================
# ESP32-C3
# ============================================================

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# ============================================================
# Logging
# ============================================================

logger:
  level: INFO
  # The PMS7003 uses GPIO20/21, which are UART0's default pins on the
  # ESP32-C3. Send logs (and Improv) over the native USB Serial/JTAG
  # port instead, so the sensor UART is free.
  hardware_uart: USB_SERIAL_JTAG

# ============================================================
# Home Assistant API
# ============================================================

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ============================================================
# OTA
# ============================================================

ota:
  - platform: esphome
    # Reuses the native API encryption key above (recommended).
    encryption:

# ============================================================
# WiFi
# ============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Keep the device from becoming unavailable while WiFi
  # is temporarily disconnected.
  reboot_timeout: 0s

  # Fallback hotspot: connect to "aetheris-xxxxxx" and open
  # http://192.168.4.1/ to change Wi-Fi or upload new firmware.
  ap:
    password: !secret wifi_ap_password

# Wi-Fi provisioning for devices that are not pre-provisioned.
# - Improv over USB:  https://www.esphome.io/components/improv_serial/
# - Improv over BLE:  use ESP Web Tools or the ESPHome app
# - Captive portal:   join the fallback hotspot after 90 seconds
improv_serial:
improv_ble:
  authorizer: none
captive_portal:

# ============================================================
# MQTT
# ============================================================

mqtt:
  # IP/hostname of the machine running docker compose.
  broker: !secret mqtt_broker
  port: 1883

  username: !secret mqtt_username
  password: !secret mqtt_password

  reboot_timeout: 0s

  on_connect:
    - logger.log: "Connected to MQTT broker"

  on_disconnect:
    - logger.log: "MQTT connection lost"

# ============================================================
# Time
# ============================================================

time:
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

# ============================================================
# I2C
#
# XIAO ESP32-C3:
#   D4 = GPIO6 = SDA
#   D5 = GPIO7 = SCL
#
# Devices:
#   SGP30  = 0x58
#   BME680 = 0x77
#   SH1106 = 0x3C
# ============================================================

i2c:
  id: i2c_bus
  sda: GPIO6
  scl: GPIO7
  scan: true

# ============================================================
# UART
#
# XIAO ESP32-C3:
#   D6 = GPIO21 = TX
#   D7 = GPIO20 = RX
#
# PMS7003:
#   PMS TX -> XIAO D7 / GPIO20
#   PMS RX -> XIAO D6 / GPIO21
# ============================================================

uart:
  id: pms_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600

# ============================================================
# SENSORS
# ============================================================

sensor:

  # ----------------------------------------------------------
  # PMS7003
  # ----------------------------------------------------------

  - platform: pmsx003
    type: PMSX003
    uart_id: pms_uart

    pm_1_0:
      id: pm1
      name: "PM1.0"
      unit_of_measurement: "µg/m³"
      device_class: pm1
      state_class: measurement

    pm_2_5:
      id: pm25
      name: "PM2.5"
      unit_of_measurement: "µg/m³"
      device_class: pm25
      state_class: measurement

    pm_10_0:
      id: pm10
      name: "PM10"
      unit_of_measurement: "µg/m³"
      device_class: pm10
      state_class: measurement

    update_interval: 60s

  # ----------------------------------------------------------
  # SGP30
  # ----------------------------------------------------------

  - platform: sgp30

    eco2:
      id: eco2
      name: "eCO2"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement

    tvoc:
      id: tvoc
      name: "TVOC"
      unit_of_measurement: "ppb"
      state_class: measurement

    store_baseline: true
    update_interval: 60s

  # ----------------------------------------------------------
  # BME680
  # ----------------------------------------------------------

  - platform: bme680
    address: 0x77

    temperature:
      id: temp
      name: "Temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    humidity:
      id: hum
      name: "Humidity"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

    update_interval: 60s

  # ----------------------------------------------------------
  # WiFi signal
  # ----------------------------------------------------------

  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    update_interval: 30s

# ============================================================
# DISPLAY PAGE STATE
# ============================================================

globals:
  - id: page
    type: int
    restore_value: no
    initial_value: "0"

# ============================================================
# FONTS
# ============================================================

font:

  - file: "fonts/profont17.bdf"
    id: pro_font17
    size: 17

  - file: "fonts/profont15.bdf"
    id: pro_font15
    size: 15

  - file: "fonts/profont12.bdf"
    id: pro_font12
    size: 12

  - file: "fonts/profont10.bdf"
