# =============================================================================
# ESPHome secrets — copy this file to `secrets.yaml` and fill in your values.
# `scripts/setup.sh` / `scripts/setup.ps1` create it for you.
#
# The same firmware is flashed to every air node; these credentials are
# shared by the whole fleet.
# =============================================================================

# --- Wi-Fi -------------------------------------------------------------------
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Password for the fallback hotspot (aetheris-xxxxxx) when Wi-Fi fails.
wifi_ap_password: "change-me-fallback"

# --- MQTT --------------------------------------------------------------------
# IP or hostname of the machine running `docker compose up`.
mqtt_broker: "192.168.1.10"
mqtt_username: "aetheris"
mqtt_password: "the-password-from-your-.env"

# --- ESPHome ----------------------------------------------------------------
# 32 random bytes, base64 encoded. Generate with:
#   openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_A_BASE64_KEY"

# Shared OTA password. Generate with:
#   openssl rand -hex 16
ota_password: "REPLACE_WITH_A_RANDOM_OTA_PASSWORD"

# IANA timezone name, e.g. Asia/Kolkata, Europe/Berlin, America/New_York
timezone: "UTC"

# --- Compatibility aliases for the older single-node YAML files -------------
ssid: "YOUR_WIFI_SSID"
password: "YOUR_WIFI_PASSWORD"
