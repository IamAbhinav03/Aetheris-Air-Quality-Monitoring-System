# =============================================================================
# Mosquitto 2.x configuration
# =============================================================================

listener 1883 0.0.0.0
protocol mqtt

# Authentication is mandatory. The `passwd` file is generated by
# scripts/setup.sh (or scripts/setup.ps1) and is git-ignored.
allow_anonymous false
password_file /mosquitto/config/passwd

# Persist subscriptions/messages so nodes can reconnect without losing data.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Queue messages for nodes that are briefly offline.
max_queued_messages 1000
max_inflight_messages 40

# Log to stdout so Alloy collects broker logs together with everything else.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
