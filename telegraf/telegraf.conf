# =============================================================================
# Telegraf — MQTT (air nodes) -> InfluxDB 3 Core
# =============================================================================
# Air nodes publish to:  airnode/<device>/state
# The <device> part becomes the `device` tag in InfluxDB, which is what the
# Grafana dashboards filter on.
# =============================================================================

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = true

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["airnode/+/state"]
  qos = 1
  client_id = "aetheris-telegraf"
  persistent_session = false
  connection_timeout = "30s"
  topic_tag = "topic"

  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

  data_format = "json_v2"

  # Every JSON key becomes a float field on the `air_quality` measurement.
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_quality"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "pm1"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "pm25"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "pm10"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "eco2"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "tvoc"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "temperature"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "humidity"
        type = "float"
      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "wifi_dbm"
        type = "float"

# -----------------------------------------------------------------------------
# Extract the device name from  airnode/<device>/state
# -----------------------------------------------------------------------------
[[processors.regex]]
  order = 1

  [[processors.regex.tags]]
    key = "topic"
    pattern = '^airnode/([^/]+)/state$'
    replacement = "${1}"
    result_key = "device"

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
[[outputs.influxdb_v3]]
  urls = ["http://influxdb3:8181"]
  database = "aetheris"

  # InfluxDB 3 Core runs with --without-auth on the private Docker network,
  # so no token is required. Set a token here if you enable auth later.
  token = ""

  content_encoding = "gzip"
  timeout = "10s"
