[global_tags]
  source = "mqtt"

[agent]
  interval = "60s"
  round_interval = true
  flush_interval = "10s"
  logfile = "/var/log/telegraf/telegraf.log"
  logtarget = "file"

###############################################################################
# INPUTS
###############################################################################

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["airnode-+/state"]   # subscribe to all nodes
  qos = 0
  data_format = "json"

  # Parse the topic into tags:
  topic_parsing = "airnode-+/state"
  # This extracts "airnode-00", "airnode-01", etc. into a tag called "node"
  tags = "_/node"

###############################################################################
# OUTPUTS
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUXDB_TELEGRAF_TOKEN}"
  organization = "default"
  bucket = "metrics"
