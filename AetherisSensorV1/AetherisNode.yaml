substitutions:
  devicename: aetheris-${chip_id}


esphome:
  name: devicename

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

logger:
  # Change level to WARN in prod
  level: DEBUG

api:
ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret ssid
  password: !secret password

mqtt:
broker: 10.42.204.213
port: 1883 # 1883 is the default mqtt port, change if you are needed
  username: mkspace-007
  password: !secret mqtt_password
  birth_message:
    topic: "status"
    payload: "${devicename} is online" # meassage to send when the esp is alive
  will_message:
    topic: "status"
    payload: "${devicename} is offline"

time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Kolkata" # change to your timezone'

uart:
  id: pms_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# Example sensors — replace with your actual ones
sensor:
  - platform: pmsx003
    type: PMSX003
    uart_id: pms_uart
    pm_1_0:
      id: pm1
      name: "PM1.0"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/pm1"
      #         payload: !lambda "return to_string(id(pm1).state);"
    pm_2_5:
      id: pm25
      name: "PM2.5"
    #   on_value:
    #     then:
    #       - mqtt.publish:
    #           topic: "airnode-00/pm25"
    #           payload: !lambda "return to_string(id(pm25).state);"
    pm_10_0:
      id: pm10
      name: "PM10.0"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/pm10"
      #         payload: !lambda "return to_string(id(pm10).state);"
    update_interval: 60s

  - platform: sgp30
    eco2:
      id: eco2
      name: "eCO2"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/eco2"
      #         payload: !lambda "return to_string(id(eco2).state);"
    tvoc:
      id: tvoc
      name: "TVOC"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/tvoc"
      #         payload: !lambda "return to_string(id(tvoc).state);"
    update_interval: 60s

  - platform: bme680
    address: 0x77
    temperature:
      id: temp
      name: "Temperature"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/temperature"
      #         payload: !lambda "return to_string(id(temp).state);"

    humidity:
      id: hum
      name: "Humidity"
      # on_value:
      #   then:
      #     - mqtt.publish:
      #         topic: "airnode-00/humidity"
      #         payload: !lambda "return to_string(id(hum).state);"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 30s

# Page selector
globals:
  - id: page
    type: int
    restore_value: no
    initial_value: "0"

