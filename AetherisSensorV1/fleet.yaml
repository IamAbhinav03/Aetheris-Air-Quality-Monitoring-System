# ============================================================
# OLED DISPLAY
# ============================================================

display:

  - platform: ssd1306_i2c
    id: my_display
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s

    pages:

      # ======================================================
      # PAGE 1 - PARTICULATE MATTER
      # ======================================================

      - id: page_pm

        lambda: |-

          const int W = it.get_width();
          const int H = it.get_height();

          const int top_h = 48;
          const int col_w = W / 3;

          const int cx0 = col_w / 2;
          const int cx1 = col_w + col_w / 2;
          const int cx2 = 2 * col_w + col_w / 2;

          // Vertical separators
          it.line(col_w, 0, col_w, top_h - 1);
          it.line(2 * col_w, 0, 2 * col_w, top_h - 1);

          // Headers
          it.print(
            cx0, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "PM1.0"
          );

          it.print(
            cx1, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "PM2.5"
          );

          it.print(
            cx2, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "PM10"
          );

          // Values
          it.printf(
            cx0, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.1f",
            id(pm1).has_state() ? id(pm1).state : 0.0
          );

          it.printf(
            cx1, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.1f",
            id(pm25).has_state() ? id(pm25).state : 0.0
          );

          it.printf(
            cx2, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.1f",
            id(pm10).has_state() ? id(pm10).state : 0.0
          );

          // Units
          it.print(
            cx0, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "µg/m³"
          );

          it.print(
            cx1, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "µg/m³"
          );

          it.print(
            cx2, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "µg/m³"
          );

          // Bottom separator
          it.line(0, 48, W - 1, 48);

          // AQI category based on PM2.5
          const char *aqi_text = "AQI --";

          if (id(pm25).has_state()) {

            const float v = id(pm25).state;

            if (v <= 12.0)
              aqi_text = "AQI Good";
            else if (v <= 35.4)
              aqi_text = "AQI Moderate";
            else if (v <= 55.4)
              aqi_text = "AQI Unhealthy SG";
            else if (v <= 150.4)
              aqi_text = "AQI Unhealthy";
            else if (v <= 250.4)
              aqi_text = "AQI Very Unhealthy";
            else
              aqi_text = "AQI Hazardous";
          }

          it.print(
            2, 52,
            id(pro_font10),
            aqi_text
          );

          // WiFi signal bars
          int bars = 0;

          if (id(wifi_signal_db).has_state()) {

            const float dbm = id(wifi_signal_db).state;

            if (dbm > -50.0)
              bars = 4;
            else if (dbm > -60.0)
              bars = 3;
            else if (dbm > -70.0)
              bars = 2;
            else if (dbm > -80.0)
              bars = 1;
          }

          const int bx = W - 22;

          for (int i = 0; i < 4; i++) {

            const int bar_h = 3 + i * 3;
            const int by = 63 - bar_h;

            if (i < bars)
              it.filled_rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
            else
              it.rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
          }


      # ======================================================
      # PAGE 2 - SGP30
      # ======================================================

      - id: page_sgp

        lambda: |-

          const int W = it.get_width();

          const int col_w = W / 2;
          const int cx0 = col_w / 2;
          const int cx1 = col_w + col_w / 2;

          // eCO2
          it.print(
            cx0, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "eCO2"
          );

          it.printf(
            cx0, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.0f",
            id(eco2).has_state() ? id(eco2).state : 0.0
          );

          it.print(
            cx0, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "ppm"
          );

          // TVOC
          it.print(
            cx1, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "TVOC"
          );

          it.printf(
            cx1, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.1f",
            id(tvoc).has_state() ? id(tvoc).state : 0.0
          );

          it.print(
            cx1, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "ppb"
          );

          // Bottom separator
          it.line(0, 48, W - 1, 48);

          // AQI category
          const char *aqi_text = "AQI --";

          if (id(pm25).has_state()) {

            const float v = id(pm25).state;

            if (v <= 12.0)
              aqi_text = "AQI Good";
            else if (v <= 35.4)
              aqi_text = "AQI Moderate";
            else if (v <= 55.4)
              aqi_text = "AQI Unhealthy SG";
            else if (v <= 150.4)
              aqi_text = "AQI Unhealthy";
            else if (v <= 250.4)
              aqi_text = "AQI Very Unhealthy";
            else
              aqi_text = "AQI Hazardous";
          }

          it.print(
            2, 52,
            id(pro_font10),
            aqi_text
          );

          // WiFi signal bars
          int bars = 0;

          if (id(wifi_signal_db).has_state()) {

            const float dbm = id(wifi_signal_db).state;

            if (dbm > -50.0)
              bars = 4;
            else if (dbm > -60.0)
              bars = 3;
            else if (dbm > -70.0)
              bars = 2;
            else if (dbm > -80.0)
              bars = 1;
          }

          const int bx = W - 22;

          for (int i = 0; i < 4; i++) {

            const int bar_h = 3 + i * 3;
            const int by = 63 - bar_h;

            if (i < bars)
              it.filled_rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
            else
              it.rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
          }


      # ======================================================
      # PAGE 3 - ENVIRONMENT
      # ======================================================

      - id: page_env

        lambda: |-

          const int W = it.get_width();

          // Temperature
          it.print(
            W / 4, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "Temperature"
          );

          it.printf(
            W / 4, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.2f",
            id(temp).has_state() ? id(temp).state : 0.0
          );

          it.print(
            W / 4, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "°C"
          );

          // Humidity
          it.print(
            3 * W / 4, 4,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "Humidity"
          );

          it.printf(
            3 * W / 4, 18,
            id(pro_font12),
            TextAlign::TOP_CENTER,
            "%.1f",
            id(hum).has_state() ? id(hum).state : 0.0
          );

          it.print(
            3 * W / 4, 30,
            id(pro_font10),
            TextAlign::TOP_CENTER,
            "%"
          );

          // Bottom separator
          it.line(0, 48, W - 1, 48);

          // AQI category
          const char *aqi_text = "AQI --";

          if (id(pm25).has_state()) {

            const float v = id(pm25).state;

            if (v <= 12.0)
              aqi_text = "AQI Good";
            else if (v <= 35.4)
              aqi_text = "AQI Moderate";
            else if (v <= 55.4)
              aqi_text = "AQI Unhealthy SG";
            else if (v <= 150.4)
              aqi_text = "AQI Unhealthy";
            else if (v <= 250.4)
              aqi_text = "AQI Very Unhealthy";
            else
              aqi_text = "AQI Hazardous";
          }

          it.print(
            2, 52,
            id(pro_font10),
            aqi_text
          );

          // WiFi signal bars
          int bars = 0;

          if (id(wifi_signal_db).has_state()) {

            const float dbm = id(wifi_signal_db).state;

            if (dbm > -50.0)
              bars = 4;
            else if (dbm > -60.0)
              bars = 3;
            else if (dbm > -70.0)
              bars = 2;
            else if (dbm > -80.0)
              bars = 1;
          }

          const int bx = W - 22;

          for (int i = 0; i < 4; i++) {

            const int bar_h = 3 + i * 3;
            const int by = 63 - bar_h;

            if (i < bars)
              it.filled_rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
            else
              it.rectangle(
                bx + i * 4,
                by,
                3,
                bar_h
              );
          }

# ============================================================
# MQTT STATE PUBLISH
# ============================================================

interval:

  - interval: 15s
    then:

      - mqtt.publish_json:
          # Unique per board: airnode/aetheris-1a2b3c/state
          # App.get_name() includes the MAC suffix at runtime.
          topic: !lambda |-
            return "airnode/" + App.get_name() + "/state";

          payload: |-
            root["pm1"] = id(pm1).state;
            root["pm25"] = id(pm25).state;
            root["pm10"] = id(pm10).state;

            root["eco2"] = id(eco2).state;
            root["tvoc"] = id(tvoc).state;

            root["temperature"] = id(temp).state;
            root["humidity"] = id(hum).state;

            root["wifi_dbm"] = id(wifi_signal_db).state;

# ============================================================
# DISPLAY PAGE ROTATION
# ============================================================

  - interval: 5s
    then:

      - display.page.show_next: my_display
      - component.update: my_display
